<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    </marker>
  </defs>

  <!-- Nuke Background Canvas -->
  <rect width="100%" height="100%" fill="#2b2d30"/>
  
  <!-- Subtle Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252729" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Pipes / Connections -->
  <!-- Read1 to FrameHold2 -->
  <line x1="560" y1="130" x2="430" y2="130" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Read1 to FrameHold1 -->
  <line x1="640" y1="130" x2="770" y2="130" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Read1 to Merge2 -->
  <line x1="600" y1="165" x2="600" y2="435" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Left Branch: FrameHold2 to RotoPaint1 -->
  <line x1="390" y1="150" x2="390" y2="210" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- RotoPaint1 to Merge3 -->
  <line x1="390" y1="235" x2="390" y2="395" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Roto2 to Blur1 -->
  <line x1="210" y1="295" x2="210" y2="375" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Blur1 to Merge3 -->
  <line x1="250" y1="395" x2="350" y2="395" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Merge3 down to dot, then Tracker2 -->
  <line x1="390" y1="415" x2="390" y2="590" stroke="#111111" stroke-width="2.5"/>
  <circle cx="390" cy="590" r="5" fill="#a0a0a0"/>
  <line x1="390" y1="590" x2="440" y2="590" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Tracker2 to Merge4 -->
  <line x1="520" y1="590" x2="565" y2="590" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Right Branch: FrameHold1 to Merge1 -->
  <line x1="860" y1="150" x2="860" y2="310" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Roto1 to Merge1 -->
  <line x1="1000" y1="330" x2="905" y2="330" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Merge1 to Tracker1 -->
  <line x1="860" y1="345" x2="860" y2="420" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Tracker1 to Merge2 -->
  <line x1="820" y1="440" x2="645" y2="440" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Merge2 down to Merge4 -->
  <line x1="600" y1="460" x2="600" y2="575" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Merge4 down through Writes to Viewer -->
  <line x1="600" y1="605" x2="600" y2="640" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="675" x2="600" y2="705" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="740" x2="600" y2="765" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- NODES -->

  <!-- Read1 Node -->
  <g filter="url(#shadow)">
    <rect x="555" y="85" width="90" height="90" rx="3" fill="#6c6e70" stroke="#222" stroke-width="1"/>
    <!-- Image thumbnail simulation -->
    <rect x="560" y="90" width="80" height="50" fill="#445566"/>
    <!-- road lines in thumbnail -->
    <path d="M 590 90 L 585 140 M 610 90 L 615 140" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="600" y="153" font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Read1</text>
    <text x="600" y="166" font-family="monospace, sans-serif" font-size="8" fill="#dddddd" text-anchor="middle">footage_v001.0131.jpg</text>
    <!-- RGB dots -->
    <rect x="560" y="171" width="6" height="3" fill="#ff2222"/>
    <rect x="567" y="171" width="6" height="3" fill="#22cc22"/>
    <rect x="574" y="171" width="6" height="3" fill="#2266ff"/>
  </g>

  <!-- FrameHold2 Node (left) -->
  <g filter="url(#shadow)">
    <polygon points="345,130 355,120 425,120 435,130 425,145 355,145" fill="#a8923c" stroke="#222" stroke-width="1"/>
    <text x="390" y="132" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">FrameHold2</text>
    <text x="390" y="142" font-family="monospace, sans-serif" font-size="9" fill="#111111" text-anchor="middle">(frame 1)</text>
    <text x="390" y="160" font-family="monospace, sans-serif" font-size="9" fill="#e69500" text-anchor="middle">bg</text>
  </g>

  <!-- FrameHold1 Node (right) -->
  <g filter="url(#shadow)">
    <polygon points="815,130 825,120 895,120 905,130 895,145 825,145" fill="#a8923c" stroke="#222" stroke-width="1"/>
    <text x="860" y="132" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">FrameHold1</text>
    <text x="860" y="142" font-family="monospace, sans-serif" font-size="9" fill="#111111" text-anchor="middle">(frame 130)</text>
  </g>

  <!-- RotoPaint1 Node -->
  <g filter="url(#shadow)">
    <rect x="350" y="210" width="80" height="25" rx="3" fill="#329668" stroke="#222" stroke-width="1"/>
    <text x="390" y="226" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RotoPaint1</text>
    <rect x="352" y="231" width="5" height="2.5" fill="#ff2222"/>
    <rect x="358" y="231" width="5" height="2.5" fill="#22cc22"/>
    <rect x="364" y="231" width="5" height="2.5" fill="#2266ff"/>
  </g>

  <!-- Roto2 Node -->
  <g filter="url(#shadow)">
    <text x="210" y="250" font-family="monospace, sans-serif" font-size="9" fill="#e69500" text-anchor="middle">bg</text>
    <rect x="170" y="258" width="80" height="35" rx="3" fill="#4d9b54" stroke="#222" stroke-width="1"/>
    <text x="210" y="274" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Roto2</text>
    <text x="210" y="286" font-family="monospace, sans-serif" font-size="9" fill="#eeeeee" text-anchor="middle">(alpha)</text>
  </g>

  <!-- Blur1 Node -->
  <g filter="url(#shadow)">
    <rect x="170" y="375" width="80" height="35" rx="3" fill="#b06528" stroke="#222" stroke-width="1"/>
    <text x="210" y="391" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Blur1</text>
    <text x="210" y="403" font-family="monospace, sans-serif" font-size="9" fill="#eeeeee" text-anchor="middle">(all)</text>
  </g>

  <!-- Merge3 Node -->
  <g filter="url(#shadow)">
    <text x="345" y="392" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500">A</text>
    <text x="390" y="375" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500" text-anchor="middle">B</text>
    <rect x="350" y="385" width="80" height="25" rx="3" fill="#284e9c" stroke="#222" stroke-width="1"/>
    <text x="390" y="401" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Merge3 (mask)</text>
    <rect x="352" y="406" width="5" height="2.5" fill="#ff2222"/>
    <rect x="358" y="406" width="5" height="2.5" fill="#22cc22"/>
    <rect x="364" y="406" width="5" height="2.5" fill="#2266ff"/>
  </g>

  <!-- Tracker2 Node -->
  <g filter="url(#shadow)">
    <text x="430" y="587" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500">A</text>
    <rect x="440" y="575" width="80" height="25" rx="3" fill="#8c8e90" stroke="#222" stroke-width="1"/>
    <circle cx="517" cy="573" r="3" fill="#ff3333"/>
    <text x="480" y="591" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Tracker2</text>
    <rect x="442" y="596" width="5" height="2.5" fill="#ff2222"/>
    <rect x="448" y="596" width="5" height="2.5" fill="#22cc22"/>
    <rect x="454" y="596" width="5" height="2.5" fill="#2266ff"/>
  </g>

  <!-- Roto1 Node (right) -->
  <g filter="url(#shadow)">
    <text x="1040" y="315" font-family="monospace, sans-serif" font-size="9" fill="#e69500" text-anchor="middle">bg</text>
    <rect x="1000" y="320" width="80" height="35" rx="3" fill="#4d9b54" stroke="#222" stroke-width="1"/>
    <text x="1040" y="336" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Roto1</text>
    <text x="1040" y="348" font-family="monospace, sans-serif" font-size="9" fill="#eeeeee" text-anchor="middle">(alpha)</text>
  </g>

  <!-- Merge1 Node (right) -->
  <g filter="url(#shadow)">
    <text x="860" y="310" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500" text-anchor="middle">B</text>
    <text x="912" y="327" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500">A</text>
    <rect x="820" y="318" width="80" height="25" rx="3" fill="#284e9c" stroke="#222" stroke-width="1"/>
    <text x="860" y="334" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Merge1 (mask)</text>
  </g>

  <!-- Tracker1 Node (right) -->
  <g filter="url(#shadow)">
    <rect x="820" y="425" width="80" height="25" rx="3" fill="#8c8e90" stroke="#222" stroke-width="1"/>
    <circle cx="897" cy="423" r="3" fill="#ff3333"/>
    <text x="860" y="441" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Tracker1</text>
    <rect x="822" y="446" width="5" height="2.5" fill="#ff2222"/>
    <rect x="828" y="446" width="5" height="2.5" fill="#22cc22"/>
    <rect x="834" y="446" width="5" height="2.5" fill="#2266ff"/>
  </g>

  <!-- Merge2 (over) Node -->
  <g filter="url(#shadow)">
    <text x="600" y="427" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500" text-anchor="middle">B</text>
    <text x="653" y="437" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500">A</text>
    <rect x="560" y="435" width="80" height="25" rx="3" fill="#284e9c" stroke="#222" stroke-width="1"/>
    <text x="600" y="451" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Merge2 (over)</text>
    <rect x="562" y="456" width="5" height="2.5" fill="#ff2222"/>
    <rect x="568" y="456" width="5" height="2.5" fill="#22cc22"/>
    <rect x="574" y="456" width="5" height="2.5" fill="#2266ff"/>
  </g>

  <!-- Merge4 (over) Node -->
  <g filter="url(#shadow)">
    <text x="600" y="567" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500" text-anchor="middle">B</text>
    <text x="555" y="587" font-family="monospace, sans-serif" font-size="9" font-weight="bold" fill="#e69500">A</text>
    <rect x="560" y="575" width="80" height="25" rx="3" fill="#284e9c" stroke="#222" stroke-width="1"/>
    <text x="600" y="591" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Merge4 (over)</text>
    <rect x="562" y="596" width="5" height="2.5" fill="#ff2222"/>
    <rect x="568" y="596" width="5" height="2.5" fill="#22cc22"/>
    <rect x="574" y="596" width="5" height="2.5" fill="#2266ff"/>
  </g>

  <!-- Write1 Node -->
  <g filter="url(#shadow)">
    <rect x="560" y="640" width="80" height="35" rx="3" fill="#c4aa28" stroke="#222" stroke-width="1"/>
    <text x="600" y="656" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Write1</text>
    <text x="600" y="668" font-family="monospace, sans-serif" font-size="8.5" fill="#222222" text-anchor="middle">ca_mp4_..mov</text>
  </g>

  <!-- Write2 Node -->
  <g filter="url(#shadow)">
    <rect x="560" y="705" width="80" height="35" rx="3" fill="#c4aa28" stroke="#222" stroke-width="1"/>
    <text x="600" y="721" font-family="monospace, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Write2</text>
    <text x="600" y="733" font-family="monospace, sans-serif" font-size="8.5" fill="#222222" text-anchor="middle">nuki_final.mov</text>
    <rect x="562" y="736" width="5" height="2.5" fill="#ff2222"/>
    <rect x="568" y="736" width="5" height="2.5" fill="#22cc22"/>
    <rect x="574" y="736" width="5" height="2.5" fill="#2266ff"/>
  </g>
</svg>